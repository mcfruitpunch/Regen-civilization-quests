name: Validate quest foundation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python tests/test_project.py
      - run: python tests/build_data.py
      - run: node --check web/quest-engine.js
      - run: node --test tests/*.test.cjs
      - run: python tests/build_prototype.py
      - run: git diff --exit-code -- web/index.html
      - name: Check JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          match = re.search(r'<script>(.*?)</script>',Path('web/index.html').read_text(),re.S)
          assert match
          Path('/tmp/regen.js').write_text(match.group(1))
          PY
          node --check /tmp/regen.js
