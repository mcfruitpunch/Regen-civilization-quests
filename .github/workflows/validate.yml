name: Validate quest foundation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python tests/test_project.py
      - run: python tests/build_data.py
      - run: python scripts/screen_quest.py
      - run: python -m unittest discover -s tests -p 'test_quest_approval.py'
      - run: node --check web/quest-engine.js
      - run: node --check web/quest-authoring.js
      - run: node --check web/quest-review.js
      - run: node --check web/simulation-engine.js
      - run: node --check web/progress-vault.js
      - run: node --test tests/*.test.cjs
      - run: python tests/build_prototype.py
      - run: python tests/build_lab.py
      - run: python scripts/check_atlas_links.py
      - run: python -m unittest discover -s tests -p 'test_atlas_boundary.py'
      - run: python -m unittest discover -s tests -p 'test_progress_backup.py'
      - run: git diff --exit-code -- web/index.html web/lab.html
      - name: Check JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          match = re.search(r'<script>(.*?)</script>',Path('web/index.html').read_text(),re.S)
          assert match
          Path('/tmp/regen.js').write_text(match.group(1))
          PY
          node --check /tmp/regen.js
      - name: Check creator inline JS and privacy boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name,expected in [('creator',2),('reviewer',3)]:
            html=Path(f'web/{name}.html').read_text()
            js=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
            assert len(js)==expected and 'quest-authoring.js' in html
            assert 'fetch(' not in html and 'XMLHttpRequest' not in html
            assert 'localStorage' not in html and 'sessionStorage' not in html
            Path(f'/tmp/regen-{name}.js').write_text(js[-1])
          PY
          node --check /tmp/regen-creator.js
          node --check /tmp/regen-reviewer.js
      - name: Check simulation lab embedded script and no outreach
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web/lab.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          assert len(scripts)==3
          assert 'simulation-engine.js' in html and 'quest-engine.js' in html
          assert 'fetch(' not in html and 'XMLHttpRequest' not in html
          assert 'localStorage' not in html and 'sessionStorage' not in html
          Path('/tmp/regen-lab.js').write_text(scripts[-1])
          PY
          node --check /tmp/regen-lab.js

